services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: signage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set a real password in .env}
      POSTGRES_DB: signage
    volumes:
      - signage-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signage"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgres://signage:${POSTGRES_PASSWORD:?set a real password in .env}@db:5432/signage"
      WORDPRESS_BASE_URL: ${WORDPRESS_BASE_URL:-https://www.wordonthestreetbooks.com}
      SIGNAGE_WEBHOOK_SECRET: ${SIGNAGE_WEBHOOK_SECRET:?set a real secret in .env}
    volumes:
      - signage-assets:/app/public/uploads

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started
    environment:
      DATABASE_URL: "postgres://signage:${POSTGRES_PASSWORD:?set a real password in .env}@db:5432/signage"
      WEB_BASE_URL: "http://web:3000"
      WORDPRESS_BASE_URL: ${WORDPRESS_BASE_URL:-https://www.wordonthestreetbooks.com}
      SYNC_POLL_CRON: ${SYNC_POLL_CRON:-*/30 * * * *}
      EXPIRE_SWEEP_CRON: ${EXPIRE_SWEEP_CRON:-*/5 * * * *}
    volumes:
      - signage-assets:/app/public/uploads

volumes:
  # Bind these to host paths instead of named volumes if you want the
  # DB/assets easy to find for filesystem-level backups (PRD §11.4/§11.5).
  signage-db-data:
  signage-assets:
